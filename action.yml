name: 'Entra ID (Azure AD) Workload Identity Federation'
description: 'Get Microsoft Entra ID (Azure AD) access tokens via GitHub OIDC workload identity federation. No secrets needed.'
author: 'Nicola Suter'
branding:
  icon: 'server'
  color: 'blue'
inputs:
  tenant_id:
    description: 'Microsoft Entra ID tenant ID'
    required: true
  client_id:
    description: 'Application (client) ID of the app registration or user-assigned managed identity'
    required: true
  audience:
    description: 'Audience of the GitHub OIDC token. Must match the audience of the federated credential.'
    required: false
    default: 'api://AzureADTokenExchange'
  scope:
    description: 'Scope to request, in the form <resource>/.default'
    required: false
    default: 'https://graph.microsoft.com/.default'
  authority_host:
    description: 'Entra ID authority host. Override for sovereign clouds, e.g. https://login.microsoftonline.us'
    required: false
    default: 'https://login.microsoftonline.com'
outputs:
  access_token:
    description: 'Access token (JWT) carrying the application permissions granted to the app. Masked in logs.'
  expires_in:
    description: 'Token lifetime in seconds'
runs:
  using: 'node24'
  main: 'dist/index.js'
